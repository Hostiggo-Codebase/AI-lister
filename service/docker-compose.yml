services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # Optional dedicated worker. The API already runs IMPORT_WORKER_CONCURRENCY
  # in-process; run this only if you want to separate API and pipeline load,
  # then set IMPORT_WORKER_CONCURRENCY=0 on the api service.
  # Start with:  docker compose --profile worker up
  worker:
    build: .
    env_file:
      - .env
    environment:
      IMPORT_WORKER_CONCURRENCY: "4"
    command: python -m app.worker
    restart: unless-stopped
    profiles: ["worker"]
